# Refreshes the live site's course data every day, so it stays current without a
# manual deploy. `npm run deploy` publishes this file to the public site repo as
# .github/workflows/refresh-data.yml, next to the download scripts in pipeline/.
name: Refresh course data

on:
  schedule:
    - cron: "17 9 * * *" # every day around 3-4 AM in Champaign
  workflow_dispatch: # the "Run workflow" button, to refresh right away

permissions:
  contents: write

concurrency: refresh-data

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install the download script's one dependency
        working-directory: pipeline
        run: npm install --no-package-lock
      - name: Find the semesters UIUC has posted, download them, and check them before using them
        run: node pipeline/scripts/refreshData.ts data
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add --all data
          git commit -m "Refresh course data"
          # A deploy may have published while this ran; put the new data on top of it.
          git pull --rebase origin gh-pages
          git push
